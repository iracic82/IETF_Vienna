# Mounted into strands-agent as /etc/resolv.conf so the in-process
# dns-aid MCP server (python -m dns_aid.mcp.server) queries CoreDNS
# directly instead of Docker's embedded DNS (127.0.0.11), which strips
# the DNSSEC AD flag.
#
# 172.28.0.53 is CoreDNS's static IP on the `lab` network (see
# docker-compose.yml ipam config). CoreDNS returns the AD flag for
# lab.ccdesanity.com (its ${ZONE} block relays it from 1.1.1.1) and
# resolves container names + public via its own 127.0.0.11 (its `.`
# block) — so trust_dnssec_pointers validates AND agentgateway resolves.
#
# trust-ad tells glibc-based tools (dig) to keep the AD flag; dnspython
# (what dns-aid uses) reads it regardless.
nameserver 172.28.0.53
options edns0 trust-ad
