title: 'DNS-AID: AI Agent Discovery via DNS (IETF Vienna Demo)'
teaser: |
  Watch an AI assistant discover, verify, and invoke a remote MCP capability using DNS-AID + agentgateway.
description: |-
  This 15-minute lab demonstrates DNS-AID, the IETF draft for AI agent
  discovery via DNS SVCB records. You'll see a Strands AI agent discover
  the federation's `ip-reputation` capability via DNS-AID, verify
  authenticity (DNSSEC + JWS-signed cap doc), and invoke it through
  agentgateway — the runtime enforcement layer.

  Companion lab: DNS-AID Workshop (`dns-aid-workshop`) — 90-min
  AI-supply-chain incident response.
