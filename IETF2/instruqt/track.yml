title: 'DNS-AID Workshop: Containing an AI-Supply-Chain Incident'
teaser: |
  Employee terminated Friday. Signing key not yet revoked. Monday morning, you find something new in your federation directory. 90 minutes to detect, contain, investigate the blast radius, and harden.
description: |-
  Hands-on incident response for an AI-supply-chain attack. The Threat-Intel
  Federation you run publishes capabilities via DNS-AID. A terminated
  employee's still-valid JWKS key was used to publish a rogue agent — and
  to tamper with a legitimate one — before they left the building.

  You'll work through 4 challenges:

    1. Spot the rogue
    2. Contain via RPZ
    3. Discover the blast radius
    4. Harden so this class of attack can't happen again

  Companion lab: DNS-AID Discovery Demo (`dns-aid-discover`) — 15-min
  walkthrough of the discovery primitive on its own.
