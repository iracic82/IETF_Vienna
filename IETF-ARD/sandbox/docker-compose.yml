# IETF lab — short focused track. Six services.
#
# Environment expected (set by Instruqt sandbox.hcl from random_id):
#   SANDBOX_SLUG          unique 8-char per-learner slug
#   GOOGLE_CLOUD_PROJECT  GCP project for Vertex AI
#   VERTEX_LOCATION       default us-east5
#   GOOGLE_APPLICATION_CREDENTIALS  path to service account JSON
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   Route 53 perms
#   HOSTED_ZONE_ID        Route 53 hosted zone ID for workshop.hvn.com

services:

  # ── 1. event-hub: pubsub for the visualizer ─────────────────────────
  event-hub:
    build: ../../shared/sidecars/event-hub
    container_name: event-hub
    ports:
      - "8888:8888"
    networks: [lab]

  # ── 2. fastmcp-ip-reputation: the single IETF capability ────────────
  fastmcp-ip-reputation:
    build: ../../shared/fastmcp-template
    container_name: fastmcp-ip-reputation
    environment:
      MCP_NAME: ip-reputation
      MCP_VERSION: "1.0.0"
      MCP_TOOLS: lookup_ip
      MCP_LOOKUP_DB: /app/lookup-db.json
      MCP_BEHAVIOR: normal
      EVENT_SINK_URL: http://event-hub:8888/events
    volumes:
      - ../../shared/fastmcp-template/lookup-db.example.json:/app/lookup-db.json:ro
    depends_on: [event-hub]
    networks: [lab]

  # ── 3a. dns-aid xDS translator — polls Route 53, pushes routes ─────
  # Watches the per-sandbox DNS-AID zone for SVCB records and translates
  # discovered agents into agentgateway xDS resources (Bind/Listener/
  # Route/Backend) over Envoy v3 ADS. No static config in the gateway.
  translator:
    build: ../../shared/translator-cors-patch
    container_name: translator
    command:
      - --mode=xds
      - --domain=${SANDBOX_SLUG}.${ZONE:-lab.ccdesanity.com}
      - --protocol=mcp
      - --agents
      - ip-reputation
      # Point at local CoreDNS (port 53 inside docker net) — keeps the
      # demo snappy by avoiding public-resolver negative-cache windows
      # (Cloudflare/Google/Quad9 can cache NXDOMAIN for 5–15 min if the
      # translator polled before the record existed). CoreDNS forwards
      # to upstream when it has no cache entry, so we always get fresh
      # authoritative answers within seconds of a publish.
      - --dns-server=coredns
      - --dns-port=53
      - --xds-listen=0.0.0.0:18000
      - --interval=5
      - --log-level=INFO
    ports:
      - "18000:18000"    # xDS gRPC (mostly for debug visibility)
    depends_on: [coredns]
    networks: [lab]

  # ── 3b. agentgateway: xDS-driven (no static routes) ─────────────────
  # Routes/backends are pushed by the translator over Envoy v3 ADS.
  # Adding/removing a DNS-AID record materializes/removes a route in
  # ~5s with no gateway restart. The static config file only sets the
  # xdsAddress and admin/stats addresses.
  agentgateway:
    # ARD lab tracks newer agentgateway releases — v1.3.1 stable
    # (2026-06-22). The v1.3.0-alpha.1 delta-xDS data-plane regression
    # that pinned the main IETF lab at v1.2.1 was fixed in the v1.3.0
    # stable line. We also carry belt-and-suspenders against any
    # residual flap: translator stickiness patch (cors_patch.py) and
    # CoreDNS prefetch + serve_stale (Corefile.tmpl). Rollback to
    # v1.2.1 here if v1.3.1 misbehaves; main IETF lab is unaffected.
    image: ghcr.io/agentgateway/agentgateway:v1.3.1
    container_name: agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    environment:
      NAMESPACE: "default"
      GATEWAY: "ietf-vienna"
      NODE_NAME: "ietf-node"
      NAME: "agentgateway"
      INSTANCE_IPS: "127.0.0.1"
    volumes:
      - ../../shared/agentgateway/rendered/config.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "3000:3000"      # caller-facing MCP traffic
      - "15000:15000"    # admin UI
      - "15020:15020"    # Prometheus stats
    depends_on:
      - translator
      - fastmcp-ip-reputation
    networks: [lab]

  # ── 4. dns-aid-mcp: wrapped so events flow to the hub ───────────────
  dns-aid-mcp:
    build: ../../shared/sidecars/dns-aid-wrapper
    container_name: dns-aid-mcp
    environment:
      EVENT_SINK_URL: http://event-hub:8888/events
      DNS_AID_BACKEND: route53
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    stdin_open: true
    tty: false
    depends_on: [event-hub]
    networks: [lab]

  # ── 5. coredns: local resolver + RPZ (RPZ trivially empty in IETF) ──
  coredns:
    image: coredns/coredns:1.11.3
    container_name: coredns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ../../shared/coredns/rendered:/etc/coredns:ro
    # Host port 53 is owned by systemd-resolved on 127.0.0.53:53. We ALSO
    # bind CoreDNS to 127.0.0.1:53 (a free bind address) so the host CLI's
    # dns-aid can use CoreDNS as its resolver and get the AD flag (see
    # setup-host). 5353 stays for `dig @127.0.0.1 -p 5353 ...`.
    ports:
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:53:53/tcp"
      - "5353:53/udp"
      - "5353:53/tcp"
    # Fixed IP so strands-agent's mounted resolv.conf can target it.
    networks:
      lab:
        ipv4_address: 172.28.0.53

  # ── 6. strands-agent: the student's interaction surface ─────────────
  strands-agent:
    build: ./strands-agent
    container_name: strands-agent
    environment:
      LAB: ietf
      SANDBOX_SLUG: ${SANDBOX_SLUG}
      ZONE: ${ZONE:-lab.ccdesanity.com}
      ROUTE53_ZONE_ID: ${HOSTED_ZONE_ID}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-us-east5}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-sa.json
      DNS_AID_BACKEND: route53
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/run/secrets/gcp-sa.json:ro
      - ../../shared/strands_dnsaid:/app/strands_dnsaid:ro
      # Query CoreDNS (172.28.0.53) directly instead of Docker's embedded
      # 127.0.0.11 (which strips the DNSSEC AD flag). The in-process
      # dns_aid.mcp.server this agent spawns needs the AD flag for
      # trust_dnssec_pointers to follow the off-domain catalog pointer.
      - ../../shared/coredns/resolv-lab.conf:/etc/resolv.conf:ro
    stdin_open: true
    tty: true
    depends_on: [agentgateway, dns-aid-mcp, coredns]
    networks: [lab]

  # ── 7. viz: DNS-AID Explorer (Next.js app, port 8080) ──────────────
  viz:
    build: ../../viz-ard
    container_name: viz
    environment:
      NEXT_PUBLIC_EVENT_HUB: http://event-hub:8888
      NEXT_PUBLIC_SANDBOX_SLUG: ${SANDBOX_SLUG}
    ports:
      - "8080:8080"
    depends_on: [event-hub]
    networks: [lab]

networks:
  lab:
    driver: bridge
    # Static subnet so CoreDNS can hold a fixed IP (172.28.0.53) that
    # strands-agent's mounted /etc/resolv.conf can point at directly —
    # bypassing Docker's AD-stripping 127.0.0.11 for the DNSSEC check.
    ipam:
      config:
        - subnet: 172.28.0.0/16
